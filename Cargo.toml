[package]
name = "transcription-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
eframe = "0.36.2"
hound = "3.5.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
ureq = { version = "3.4.2", features = ["json"] }
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
